<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" role="img" aria-label="Anjani K. Maurya">
  <title>Anjani K. Maurya</title>
  <desc>A two-dimensional small-angle X-ray scattering pattern from an oriented semicrystalline polymer. A central beamstop absorbs the transmitted beam. Concentric rings record isotropic scattering. Paired meridional reflections above and below the centre arise from lamellar stacking along the fibre axis, and paired equatorial streaks left and right arise from the fibrillar form factor. The pattern is centrosymmetric, as Friedel's law requires.</desc>

  <!-- fibre axis: direction of molecular alignment -->
  <path d="M20 2.5 V6.2" stroke="#807E76" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M20 33.8 V37.5" stroke="#807E76" stroke-width="1.2" stroke-linecap="round"/>

  <!-- isotropic scattering: concentric rings -->
  <circle cx="20" cy="20" r="16" fill="none" stroke="#8C1515" stroke-width="1" opacity="0.22"/>
  <circle cx="20" cy="20" r="11" fill="none" stroke="#8C1515" stroke-width="1.2" opacity="0.4"/>
  <circle cx="20" cy="20" r="6.4" fill="none" stroke="#8C1515" stroke-width="1.5" opacity="0.64"/>

  <!-- meridional reflections: lamellar stacking along the fibre axis -->
  <path d="M25.2 10.3 A11 11 0 0 0 14.8 10.3" fill="none" stroke="#8C1515" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M14.8 29.7 A11 11 0 0 0 25.2 29.7" fill="none" stroke="#8C1515" stroke-width="3.4" stroke-linecap="round"/>

  <!-- equatorial streaks: fibrillar form factor, perpendicular to the axis -->
  <path d="M32 20 H36.5" stroke="#C22B2B" stroke-width="2.3" stroke-linecap="round"/>
  <path d="M3.5 20 H8" stroke="#C22B2B" stroke-width="2.3" stroke-linecap="round"/>

  <!-- beamstop absorbing the transmitted beam -->
  <circle cx="20" cy="20" r="3.2" fill="#2E2D29"/>
</svg>
